repos:
  - repo: local
    hooks:
      - id: check-agent-sync
        name: Verify managed keys in committed agent seeds
        entry: .agents/scripts/sync.py check
        language: script
        always_run: true
        pass_filenames: false
      - id: lock-agent-skills
        name: Re-lock skills and verify frontmatter
        entry: .agents/scripts/check-skills.py --update
        language: system
        always_run: true
        pass_filenames: false
      - id: trailing-whitespace
        name: Reject trailing whitespace outside vendored skills
        entry: bash -c '! git grep -nI -E "[[:blank:]]+$" -- . ":(exclude).agents/skills/**"'
        language: system
        always_run: true
        pass_filenames: false
