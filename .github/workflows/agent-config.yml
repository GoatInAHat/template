name: Validate agent configuration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-agent-config:
    name: Agent configuration is current
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate scripts
        run: |
          bash -n .agents/scripts/bootstrap.sh \
                  .agents/scripts/link-skills.sh \
                  .agents/scripts/sync-mcp.sh \
                  .claude/hooks/session-start.sh
          python3 -m py_compile .agents/scripts/check-skills.py

      - name: Verify skill links
        shell: bash
        run: |
          .agents/scripts/link-skills.sh

          if [ -n "$(git status --porcelain)" ]; then
            echo "Skill links are stale. Run .agents/scripts/link-skills.sh and commit the result."
            git status --short
            exit 1
          fi

          broken_links="$(find .claude/skills .cursor/skills -type l ! -exec test -e {} \; -print)"
          if [ -n "$broken_links" ]; then
            echo "Broken skill links:"
            echo "$broken_links"
            exit 1
          fi

      - name: Verify skill lock
        run: .agents/scripts/check-skills.py

      - name: Verify MCP adapters
        run: .agents/scripts/sync-mcp.sh check

      - name: Validate generated configuration syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          for path in (
              Path(".agents/mcp/servers.json"),
              Path(".claude/settings.json"),
              Path(".gemini/settings.json"),
              Path(".devcontainer/devcontainer.json"),
              Path(".mcp.json"),
              Path(".cursor/mcp.json"),
              Path("skills-lock.json"),
          ):
              json.loads(path.read_text(encoding="utf-8"))

          for path in (
              Path(".codex/config.toml"),
              Path(".codex/environments/environment.toml"),
          ):
              tomllib.loads(path.read_text(encoding="utf-8"))
          PY

      - name: Reject trailing whitespace outside vendored skills
        shell: bash
        run: |
          if git grep -nI -E '[[:blank:]]+$' -- . ':(exclude).agents/skills/**'; then
            echo "Tracked files contain trailing whitespace."
            exit 1
          fi

      - name: Test environment bootstrap
        run: .agents/scripts/bootstrap.sh

      - name: Run pre-commit hooks
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pre-commit run --all-files --show-diff-on-failure
