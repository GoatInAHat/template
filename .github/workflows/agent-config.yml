name: Validate agent configuration

# Runs only when agent configuration itself changes, so ordinary pull requests
# cost nothing. Drop the paths filters to validate every pull request instead —
# and drop them before making this a required status check, since a filtered
# workflow never reports on the pull requests it skips.
on:
  pull_request:
    paths:
      - '.agents/**'
      - '.devcontainer/**'
      - '.github/**'
      - '.gitignore'
      - '.pre-commit-config.yaml'
      - 'skills-lock.json'
      - 'AGENTS.md'
  push:
    branches:
      - main
    paths:
      - '.agents/**'
      - '.devcontainer/**'
      - '.github/**'
      - '.gitignore'
      - '.pre-commit-config.yaml'
      - 'skills-lock.json'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-agent-config:
    name: Agent configuration is current
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate scripts
        run: |
          bash -n .agents/scripts/bootstrap.sh .agents/setup
          python3 -m py_compile .agents/scripts/sync.py \
                                .agents/scripts/check-skills.py \
                                .agents/hooks/workflow-model-mix.py

      - name: Verify no generated adapter is committed
        # Every renderer output must be gitignored and absent from the index.
        # Runs before bootstrap so it reads the repository as checked out.
        run: .agents/scripts/sync.py check

      - name: Verify skill lock
        run: .agents/scripts/check-skills.py

      - name: Bootstrap environment
        # GITHUB_ACTIONS=true makes sync.py generate every harness's
        # adapters, so the steps below validate all of them.
        run: .agents/scripts/bootstrap.sh

      - name: Verify generated files are gitignored
        # Every file bootstrap generates must be ignored; anything untracked
        # after a bootstrap run means .gitignore fell out of step with
        # sync.py's renderers.
        shell: bash
        run: |
          untracked="$(git status --porcelain)"
          if [ -n "$untracked" ]; then
            echo "Bootstrap left files that are neither tracked nor ignored:"
            echo "$untracked"
            echo "Add them to the generated-adapters block in .gitignore."
            exit 1
          fi

      - name: Verify skill links
        shell: bash
        run: |
          broken_links="$(find . -maxdepth 3 -type l ! -exec test -e {} \; -print)"
          if [ -n "$broken_links" ]; then
            echo "Broken symlinks:"
            echo "$broken_links"
            exit 1
          fi

      - name: Validate generated configuration syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          for path in (
              Path(".agents/mcp/servers.json"),
              Path(".devcontainer/devcontainer.json"),
              Path("skills-lock.json"),
              # Generated by the bootstrap step above:
              Path(".mcp.json"),
              Path(".claude/settings.json"),
              Path(".gemini/settings.json"),
              Path(".cursor/mcp.json"),
              Path(".vscode/mcp.json"),
              Path("opencode.json"),
              Path("kilo.jsonc"),
              Path(".factory/mcp.json"),
              Path(".qwen/settings.json"),
              Path(".amp/settings.json"),
          ):
              json.loads(path.read_text(encoding="utf-8"))

          tomllib.loads(Path(".codex/config.toml").read_text(encoding="utf-8"))
          PY

      - name: Reject trailing whitespace outside vendored skills
        shell: bash
        run: |
          if git grep -nI -E '[[:blank:]]+$' -- . ':(exclude).agents/skills/**'; then
            echo "Tracked files contain trailing whitespace."
            exit 1
          fi

      - name: Run pre-commit hooks
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pre-commit run --all-files --show-diff-on-failure
